<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- DS-02: no dark theme exists (darkMode config removed) — declaring
         color-scheme keeps the OS/browser from applying its own dark-mode
         guesses (inverted form controls, dark scrollbars) on top of a page
         that has no dark palette to match them. -->
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- Arabic is the default language (see LocaleContext.tsx / locale-init.js) — these
         are the pre-hydration defaults a crawler or an unfurled share link sees before
         hooks/usePageMeta.ts overwrites them per-route/per-locale after mount. -->
    <title>العاصمة — واحد مسؤول عن شغل شقتك من أول مكالمة لحد التسليم</title>
    <meta name="description" content="تشطيبات، ديكور، مطابخ، نقل عفش في العاصمة الإدارية. سعر مكتوب قبل ما تبدأ، ومتابعة مننا لحد ما الشغل يخلّص." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="العاصمة" />
    <meta property="og:title" content="العاصمة — واحد مسؤول عن شغل شقتك من أول مكالمة لحد التسليم" />
    <meta property="og:description" content="تشطيبات، ديكور، مطابخ، نقل عفش في العاصمة الإدارية. سعر مكتوب قبل ما تبدأ، ومتابعة مننا لحد ما الشغل يخلّص." />
    <meta property="og:locale" content="ar_EG" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://al-assema.tech/?lang=ar" />
    <meta property="og:image" content="https://al-assema.tech/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="العاصمة — واحد مسؤول عن شغل شقتك من أول مكالمة لحد التسليم" />
    <meta name="twitter:description" content="تشطيبات، ديكور، مطابخ، نقل عفش في العاصمة الإدارية. سعر مكتوب قبل ما تبدأ، ومتابعة مننا لحد ما الشغل يخلّص." />
    <meta name="twitter:image" content="https://al-assema.tech/logo.png" />
    <link rel="canonical" href="https://al-assema.tech/?lang=ar" />
    <link rel="alternate" hreflang="ar" href="https://al-assema.tech/?lang=ar" />
    <link rel="alternate" hreflang="en" href="https://al-assema.tech/?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://al-assema.tech/?lang=ar" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#005578" />
    <link rel="preload" as="image" href="/img/seed-16.jpg" />
    <!-- Material Symbols is a large (~1.1MB) VARIABLE font (see fonts.css's own
         note on why it's never subset), and @font-face resources are normally
         fetched lazily — only once the browser lays out an element that needs
         them, which on this SPA means after HTML → JS → React render, not at
         first paint. `font-display: block` only hides the icon-name fallback
         text for ~3s; a slow network/device can genuinely take longer than
         that to fetch AND shape a font this size, and the reported "broken
         icon" screenshots (a category icon, then the hardcoded delete icon —
         both verified to have correct ligature data in the font itself) are
         consistent with exactly that window. Preloading starts the byte fetch
         immediately, in parallel with the JS bundle, instead of waiting for
         React to mount before the browser even knows the font is needed.
         `crossorigin` is required even for a same-origin font — browsers
         always fetch fonts in CORS mode, and without it the preload and the
         real fetch are treated as different requests, doubling the download
         instead of reusing it. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/material-symbols-outlined-fallback-100_700.woff2" crossorigin />
    <!-- Locale init: apply saved dir/lang before React hydrates to prevent FOUC.
         External (not inline) so the CSP can drop 'unsafe-inline' from script-src. -->
    <script src="/locale-init.js"></script>
    <!-- ── Fonts are SELF-HOSTED. Do not re-add a fonts.googleapis.com <link>. ──
         Two external stylesheets used to sit here, and a stylesheet in <head> is
         render-blocking. Against a host that is blackholed rather than refused
         (DNS resolves, packets are dropped — how Google-domain filtering
         commonly behaves on some carrier and corporate networks) that stalls the
         FIRST PAINT until the browser's connection timeout: tens of seconds of
         blank white page, on every route, before any JS has run. No error
         boundary, no offline screen, no telemetry — and it only affects some
         networks, so it never reproduces on a machine you test from.

         The @font-face rules now live in src/fonts.css, bundled into the app's
         own hashed stylesheet and served from this origin. The WOFF2 files are
         the exact subsets Google was serving, unicode-range and all, so users
         download no more bytes than before.

         `font-display` is preserved per family there, and the icon font's
         `block` is load-bearing rather than cosmetic: Material Symbols is a
         LIGATURE font, so with a fallback showing, every icon renders as its own
         name in plain words — "favorite", "search", "receipt_long" — which is
         both wrong to look at and wider than the fixed-size button holding it.
         Measured with the font unavailable: the bottom nav overflowed a 320px
         phone by 53px and icon buttons overflowed their own 40px box by 17px.
         `block` keeps the glyph slot invisible until the real font arrives. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
