name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alassema
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/alassema?schema=public
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: npm run lint --if-present
      - run: npm test
      - run: npm run test:integration

      # Dependency advisories, on every push rather than at audit time.
      #
      # Not a bare `npm audit --omit=dev`: that flag does not actually exclude
      # the prisma CLI chain (a devDependency nothing in `dependencies`
      # reaches), so it fails on day one — see api/scripts/audit-ci.mjs, which
      # fails on any high/critical EXCEPT a short list documented as
      # unreachable from a request.
      #
      # This exists because a HIGH advisory (libvips, via the sharp that Next
      # bundles) sat in the tree unnoticed until a manual audit found it.
      - name: Audit production dependencies
        run: npm run audit:ci

      # Debug logging that reaches production is a recurring failure mode here:
      # three `// TEMP` console.log lines in realtime.service.ts — printing a
      # customer channel id and the full event payload on every publish — were
      # sitting uncommitted in the working tree, one `npm run ship` away from
      # deploying.
      - name: Reject leftover debug markers
        run: |
          if grep -rn "// TEMP" src/ --include="*.ts"; then
            echo "::error::Leftover '// TEMP' marker in api/src — remove it before merging."
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc -b
