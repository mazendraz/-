[package]
name = "desktop"
version = "0.1.0"
description = "AL ASIMA Business Control Center — internal desktop app"
authors = ["Al Asima"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# All Al Asima API calls go through this plugin's Rust-side HTTP client
# (reqwest under the hood), not the webview's own fetch — so requests are
# NOT subject to the webview's CORS/CSP origin checks, and the existing
# Next.js API needs no CORS changes to serve this app. See src/lib/api.ts.
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS-native credential storage for the session token (Windows Credential Manager /
# macOS Keychain / Linux Secret Service) — see src/auth.rs. Never written to disk
# as plain JSON, unlike a plugin-store approach. Default features ("v1") cover
# all three platform backends.
keyring = "4"

